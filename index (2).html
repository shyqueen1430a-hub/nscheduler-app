<style>
:root{--base:#A3124F;--a1:#7A0E3C;--a2:#CF4A86;--bg:#FDF0F4;--card:#fff;--ink:#3A1226;--mute:#8A5C6E;--line:#EBCFD9;--soft:#F7E2EA;--acc:#A3124F;--on:#fff;--nav:#7A0E3C;--gold:#F6D58A;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.55 'DM Sans',system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:9px 14px}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
h1,h2{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;line-height:1.02;margin:0}
#top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--bg);border-bottom:1px solid var(--line)}
#crumb{flex:1;text-align:center;font:600 clamp(19px,5.2vw,26px)/1.1 'Cormorant Garamond',Georgia,serif;letter-spacing:.02em;color:var(--acc)}
.ib{width:44px;height:44px;padding:0;display:grid;place-items:center;flex:none}.ib svg{width:20px;height:20px}
.av{background:linear-gradient(135deg,var(--a2),var(--base));color:#fff;font-weight:700;border:0}
main{max-width:720px;margin:0 auto;padding:16px 14px 130px}
.hero{position:relative;overflow:hidden;color:#FFF3E0;border-radius:32px;padding:18px 22px 24px;background:linear-gradient(135deg,var(--a1),var(--base) 55%,var(--a2))}
.hnav{display:flex;justify-content:space-between;gap:8px;margin-bottom:16px}
.hnav button{background:rgba(0,0,0,.18);border:1px solid rgba(255,255,255,.25);color:var(--gold);font-weight:500}
.eyebrow{color:var(--gold);letter-spacing:.14em;text-transform:uppercase;font-weight:500;font-size:13px;margin:0}
.hero h1{font-size:clamp(38px,11vw,56px);margin:10px 0}.hero p{margin:0 0 12px;max-width:34ch}.time{color:var(--gold);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:28px;padding:22px 20px;margin-top:16px}
.lab{letter-spacing:.14em;text-transform:uppercase;font-weight:700;font-size:15px;margin:0 0 2px}
.sub{color:var(--mute);margin:0 0 14px}
.in{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:11px 13px}
textarea.in{min-height:150px;resize:vertical}
.row{display:flex;align-items:center;gap:10px;padding:6px 0}
.chk{width:22px;height:22px;accent-color:var(--base);flex:none}
.done span{text-decoration:line-through;color:var(--mute)}
.x{border:0;background:none;color:var(--mute);padding:4px 8px}
.pb{background:var(--acc);color:var(--on);border:0;font-weight:700}
.bar{height:10px;border-radius:10px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--base),var(--a2))}
.slot{display:grid;grid-template-columns:84px 1fr auto;gap:10px;align-items:center;padding:3px 0}
.slot label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right;color:var(--mute);font-size:13px}.slot.now label{color:var(--acc);font-weight:700}.slot.now .in{border-color:var(--acc);background:var(--soft)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px}.cal div{text-align:center;color:var(--mute);font-size:12px}
.cal button{aspect-ratio:1;padding:0;position:relative}.cal .t{background:var(--soft);border-color:var(--acc)}.cal .s{background:var(--acc);color:var(--on)}
.cal .d::after{content:"";position:absolute;bottom:5px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--a2)}
.dots{display:flex;gap:6px;flex-wrap:wrap}.dots button{width:36px;height:36px;padding:0;border-radius:50%;font-size:12px}.dots .y{background:var(--acc);color:var(--on);border:0}
.chart{display:flex;align-items:flex-end;gap:8px;height:150px}.chart div{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;font-size:12px;color:var(--mute)}
.chart i{width:100%;border-radius:10px 10px 4px 4px;background:linear-gradient(var(--a2),var(--base));min-height:4px}
.prompt{background:var(--soft);border:1px solid var(--line);border-radius:24px;padding:20px;margin-bottom:14px}.prompt h2{font-size:32px}
.opt{border:1px solid var(--line);border-radius:20px;padding:16px;margin-top:12px}.opt b{display:block;margin-bottom:2px}.opt .sub{margin-bottom:10px}
.sws{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.sw{width:40px;height:40px;border-radius:50%;padding:0;border:3px solid var(--card);box-shadow:0 0 0 1px var(--line)}.sw.on{box-shadow:0 0 0 2px var(--ink)}
.seg{display:flex;gap:6px}.seg button.on{background:var(--acc);color:var(--on);border-color:var(--acc)}
